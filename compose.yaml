services:
  api:
    build:
      context: ./API
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy


  tally_app:
    command: ["python3", "main.py", "35", "5", "3"]
    build:
      context: ./Tally_app
    environment:
      PYTHONBUFFERED: 1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    

  
  verify_app:
    build:
      context: ./Verify_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  verify_frontend:
    build:
      context: ./Verify_app_frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  cast_frontend:
    build:
      context: ./Cast_app_frontend
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_started
  
  cast_app:
    command: ["python3", "main.py", "50", "30"]
    build:
      context: ./Cast_app
    environment: 
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      tally_app:
        condition: service_started  
      
       

  
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 5
      start_period: 30s
      timeout: 10s      

  
volumes:
  db-data: