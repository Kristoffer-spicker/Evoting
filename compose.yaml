services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - api
      - cast_frontend
    networks:
      - evoting

  api:
    build:
      context: ./API
    expose:
      - "8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    networks:
      - evoting

  cast_app:
    command: ["python3", "main.py", "50", "250"]
    build:
      context: ./Cast_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - evoting

  cast_frontend:
    build:
      context: ./Cast_app_frontend
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_started
    networks:
      - evoting

  verify_app:
    command: ["python3", "main.py"]
    build:
      context: ./Verify_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - evoting

  verify_frontend:
    build:
      context: ./Verify_app_frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    networks:
      - evoting

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http --url=unfitted-startle-monthly.ngrok-free.dev nginx:443
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - evoting

networks:
  evoting:
    external: true
