services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TALLY_USER: ${TALLY_USER}
      TALLY_PASSWORD: ${TALLY_PASSWORD}
      CAST_USER: ${CAST_USER}
      CAST_PASSWORD: ${CAST_PASSWORD}
      VERIFY_USER: ${VERIFY_USER}
      VERIFY_PASSWORD: ${VERIFY_PASSWORD}
      API_USER: ${API_USER}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./Database/zinit.sh:/docker-entrypoint-initdb.d/zinit.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      start_period: 60s
      timeout: 10s
    networks:
      - evoting

  tally_app:
    command: ["python3", "main.py", "250", "5", "3", "7"]
    build:
      context: ./Tally_app
    environment:
      PYTHONBUFFERED: 1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${TALLY_USER}
      DB_PASSWORD: ${TALLY_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evoting

networks:
  evoting:
    driver: bridge
    name: evoting
